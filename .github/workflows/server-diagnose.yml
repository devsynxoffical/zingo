name: Server config diagnose (read-only)

# Reads server config over FTPS and prints ONLY non-secret settings.
# Passwords, keys and usernames are never printed.
on:
  workflow_dispatch:

concurrency:
  group: server-maintenance
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.FTP_SERVER }}
      FTPUSER: ${{ secrets.FTP_USERNAME }}
      FTPPASS: ${{ secrets.FTP_PASSWORD }}
      DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Inspect
        run: |
          set +e
          D="${DIR:-./}"; D="${D#./}"; D="${D%/}"; BASE="ftp://$HOST/${D:+$D/}"
          printf 'machine %s login %s password %s\n' "$HOST" "$FTPUSER" "$FTPPASS" > "$HOME/.netrc"; chmod 600 "$HOME/.netrc"
          c() { curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 "$@"; }
          echo "== root"; c --list-only "$BASE"
          echo "== database/"; c --list-only "${BASE}database/"
          echo "== database listing (sizes)"; c "${BASE}database/" 2>/dev/null | grep -i sqlite
          echo "== bootstrap/cache/"; c --list-only "${BASE}bootstrap/cache/"
          echo "== storage/logs/"; c "${BASE}storage/logs/" 2>/dev/null | tail -5
          c -o env.txt "${BASE}.env" && echo "== .env (non-secret keys only; secrets shown as SET/EMPTY)" || echo ".env not readable"
          if [ -f env.txt ]; then
            grep -oE '^[A-Z_]+=' env.txt | tr -d '=' | tr '\n' ' '; echo
            grep -E '^(APP_ENV|APP_DEBUG|APP_URL|DB_CONNECTION|DB_DATABASE|DB_HOST|DB_PORT|MAIL_MAILER|MAIL_HOST|MAIL_PORT|MAIL_ENCRYPTION|MAIL_SCHEME|MAIL_FROM_ADDRESS|LOG_CHANNEL|LOG_LEVEL|SESSION_DRIVER|CACHE_STORE|QUEUE_CONNECTION)=' env.txt
            for k in DB_USERNAME DB_PASSWORD MAIL_USERNAME MAIL_PASSWORD APP_KEY; do
              v=$(grep -E "^$k=" env.txt | cut -d= -f2-); [ -n "$v" ] && [ "$v" != "null" ] && echo "$k=SET" || echo "$k=EMPTY"
            done
          fi
          if c -o cfg.php "${BASE}bootstrap/cache/config.php"; then
            echo "== bootstrap/cache/config.php EXISTS (cached config overrides .env)"
            grep -oE "'database' => '[^']*sqlite'|'debug' => (true|false)|'default' => '(sqlite|mysql|smtp|log|sendmail)'" cfg.php | sort -u
          else echo "== no bootstrap/cache/config.php"; fi
          rm -f env.txt cfg.php "$HOME/.netrc"
          echo "== latest laravel.log lines mentioning mail/smtp (messages only)"
          c -r -200000 "${BASE}storage/logs/laravel.log" 2>/dev/null | grep -iE "smtp|mailer|Swift|Symfony\\\\Component\\\\Mailer|Connection could not" | cut -c1-220 | tail -5
