name: Server cleanup (malware + Laravel cache)

# Manual, one-off maintenance over FTPS using the same secrets as the deploy.
# Deletes only the known malware / retired files listed below, any .php file inside
# public/assets (no legitimate PHP lives there), and Laravel's compiled caches.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.FTP_SERVER }}
      USER: ${{ secrets.FTP_USERNAME }}
      PASS: ${{ secrets.FTP_PASSWORD }}
      DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write lftp connection settings
        run: |
          cat > "$HOME/.lftprc" <<'RC'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 60
          set net:max-retries 3
          set cmd:fail-exit false
          RC
          echo "open -u \"$USER\",\"$PASS\" -p 21 \"$HOST\"" > "$HOME/open.lftp"
          echo "cd \"${DIR:-./}\"" >> "$HOME/open.lftp"

      - name: Inventory (before)
        run: |
          lftp -c "source $HOME/open.lftp; echo '== root'; cls -l; echo '== public'; cls -l public/; echo '== php files under public/assets'; find public/assets" | tee "$HOME/before.txt" | grep -Ei '^== |\.php$|\.zip$|error_log|shell|security|style2' || true

      - name: Delete malware and retired files
        run: |
          {
            echo "source $HOME/open.lftp"
            for f in \
              shell.php \
              update_service_pages.php \
              public/SS.zip \
              public/error_log \
              public/style2.php \
              public/security.php \
              public/assets/index.blade.php \
              public/assets/images/CRM.mhtml \
              resources/views/blog2.blade.php \
              resources/views/blog/top_5_tasks.blade.php; do
              echo "rm -f \"$f\""
            done
            # any PHP file hidden inside public/assets
            grep -E '^public/assets/.*\.php$' "$HOME/before.txt" | while read -r f; do echo "rm -f \"$f\""; done
          } > "$HOME/delete.lftp"
          echo "Deleting:"; grep '^rm' "$HOME/delete.lftp"
          lftp -f "$HOME/delete.lftp"

      - name: Clear Laravel caches
        run: |
          lftp -c "source $HOME/open.lftp; cd storage/framework/views && mrm -f *.php; cd ../../../bootstrap/cache && rm -f config.php routes-v7.php routes.php events.php; cd ../..; echo '== views cache now'; cls storage/framework/views/ | head; echo '== bootstrap/cache now'; cls bootstrap/cache/"

      - name: Verify (after)
        run: |
          lftp -c "source $HOME/open.lftp; echo '== public'; cls -l public/; echo '== php under public/assets'; find public/assets" | grep -Ei '^== |\.php$|\.zip$|error_log' || true
          echo "Remaining suspicious files listed above (index.php in public/ is expected)."
