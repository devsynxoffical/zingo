name: Server cleanup (malware + Laravel cache)

# Manual, one-off maintenance over FTPS (curl, TLS certificate verified, hard timeouts).
# Deletes only the known malware / retired files listed below, any .php file inside
# public/assets (no legitimate PHP lives there), and Laravel's compiled caches.
on:
  workflow_dispatch:

concurrency:
  group: server-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.FTP_SERVER }}
      FTPUSER: ${{ secrets.FTP_USERNAME }}
      FTPPASS: ${{ secrets.FTP_PASSWORD }}
      DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Prepare
        run: |
          D="${DIR:-./}"; D="${D#./}"; D="${D%/}"
          BASE="ftp://$HOST/${D:+$D/}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          printf 'machine %s login %s password %s\n' "$HOST" "$FTPUSER" "$FTPPASS" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Connection and certificate check
        run: |
          curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 --retry 3 --retry-delay 10 \
               --list-only "$BASE" > root-list.txt
          echo "Connected with a verified TLS certificate. Root entries:"; cat root-list.txt

      - name: Inventory (before)
        run: |
          set +e
          ls_dir() { curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 --retry 2 --list-only "$BASE$1/" 2>/dev/null | sed "s#^#$1/#"; }
          {
            ls_dir public
            for d in public/assets public/assets/css public/assets/js public/assets/fonts public/assets/images public/assets/images/blog public/assets/images/gallery; do ls_dir "$d"; done
          } > inventory.txt
          echo "== Suspicious files found:"
          grep -E '\.php$|\.zip$|error_log|\.mhtml$' inventory.txt | grep -v '^public/index\.php$' | tee suspicious.txt
          grep -E '^(shell\.php|update_service_pages\.php)$' root-list.txt | tee -a suspicious.txt
          true

      - name: Delete malware and retired files
        run: |
          set +e
          {
            printf '%s\n' shell.php update_service_pages.php public/SS.zip public/error_log public/style2.php public/security.php \
              public/assets/index.blade.php public/assets/images/CRM.mhtml \
              resources/views/blog2.blade.php resources/views/blog/top_5_tasks.blade.php
            grep -E '^public/assets/.*\.php$' inventory.txt
          } | sort -u > delete.txt
          for f in $(cat delete.txt); do
            out=$(curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 -Q "-DELE $f" "$BASE" -o /dev/null 2>&1)
            if [ -z "$out" ]; then echo "deleted  $f"; else echo "skipped  $f ($(echo "$out" | tail -1 | cut -c1-80))"; fi
          done

      - name: Clear Laravel caches
        run: |
          set +e
          for f in $(curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 --list-only "${BASE}storage/framework/views/" | grep '\.php$'); do
            curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 -Q "-DELE storage/framework/views/$f" "$BASE" -o /dev/null && n=$((n+1))
          done
          echo "Compiled views removed: ${n:-0}"
          for f in config.php routes-v7.php routes.php events.php; do
            curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 -Q "-DELE bootstrap/cache/$f" "$BASE" -o /dev/null 2>/dev/null && echo "removed bootstrap/cache/$f"
          done
          true

      - name: Verify (after)
        run: |
          set +e
          for d in public public/assets/css public/assets/js public/assets/fonts public/assets/images/blog public/assets/images/gallery; do
            curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 --list-only "$BASE$d/" 2>/dev/null | sed "s#^#$d/#"
          done | grep -E '\.php$|\.zip$|error_log' | grep -v '^public/index\.php$' && echo "^ still present" || echo "No suspicious files left in checked folders."
          curl -sS --netrc --ssl-reqd --connect-timeout 30 --max-time 60 --list-only "$BASE" | grep -E '^(shell\.php|update_service_pages\.php)$' && echo "^ still present in root" || echo "Root is clean."
          rm -f "$HOME/.netrc"
