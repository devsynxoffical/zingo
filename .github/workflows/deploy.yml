name: Deploy to zingoassist.us (FTP)

# Deploys every push to main over FTPS with lftp (auto-reconnect + retries).
# Only files changed since the last successful deploy are uploaded: the deployed
# commit is stored on the server in .deploy-sha (outside public/). If it is missing,
# all site files are uploaded. Files are never deleted by this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Upload all site files (ignore last deployed commit)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST: ${{ secrets.FTP_SERVER }}
      USER: ${{ secrets.FTP_USERNAME }}
      PASS: ${{ secrets.FTP_PASSWORD }}
      DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Configure lftp
        run: |
          cat > "$HOME/.lftprc" <<'RC'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 45
          set net:max-retries 8
          set net:reconnect-interval-base 10
          set net:reconnect-interval-max 60
          set net:persist-retries 5
          set cmd:fail-exit true
          RC
          printf 'open -u "%s","%s" -p 21 "%s"\ncd "%s"\n' "$USER" "$PASS" "$HOST" "${DIR:-./}" > "$HOME/open.lftp"

      - name: Work out which files to upload
        id: files
        run: |
          set +e
          for i in 1 2 3; do
            lftp -c "source $HOME/open.lftp; cat .deploy-sha" > last-sha.txt 2>/dev/null && break
            echo "(no previous deploy marker or connection retry $i)"; sleep 5
          done
          set -e
          LAST=$(tr -dc '0-9a-f' < last-sha.txt | head -c 40)
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.full }}" = "true" ] || ! git cat-file -e "$LAST^{commit}" 2>/dev/null; then
            echo "Full upload (no usable previous deploy marker)"
            git ls-files > candidates.txt
          else
            echo "Uploading changes since $LAST"
            git diff --name-only --diff-filter=AMR "$LAST" HEAD > candidates.txt
          fi
          # Never upload secrets, tooling, docs or server-only state.
          grep -vE '^(\.git|\.github/|\.env|vendor/|storage/|bootstrap/cache/|node_modules/|tests/|docs/|scripts/|deploy-package/|public/assets/sass/|\.cpanel\.yml$|composer\.phar$|README\.md$|.*\.ps1$|shell\.php$|update_service_pages\.php$|public/SS\.zip$|public/error_log$)' candidates.txt \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done > upload.txt || true
          echo "count=$(wc -l < upload.txt)" >> "$GITHUB_OUTPUT"
          echo "Files to upload: $(wc -l < upload.txt)"; head -50 upload.txt

      - name: Upload over FTPS
        if: steps.files.outputs.count != '0'
        run: |
          {
            echo "source $HOME/open.lftp"
            sed 's#/[^/]*$##' upload.txt | grep '/' | sort -u | while read -r d; do echo "mkdir -p -f \"$d\""; done
            while read -r f; do echo "put \"$f\" -o \"$f\""; done < upload.txt
          } > upload.lftp
          ok=0
          for attempt in 1 2 3; do
            echo "== attempt $attempt"
            if lftp -f upload.lftp; then ok=1; break; fi
            sleep $((attempt * 30))
          done
          [ "$ok" = 1 ] || { echo "Upload failed after 3 attempts"; exit 1; }

      - name: Record deployed commit and clear Laravel view cache
        run: |
          git rev-parse HEAD > .deploy-sha
          lftp -c "source $HOME/open.lftp; put .deploy-sha -o .deploy-sha; set cmd:fail-exit false; cd storage/framework/views && mrm -f *.php" || true
          echo "Deployed $(git rev-parse --short HEAD) ($(wc -l < upload.txt) files)"

      - name: Notify search engines (IndexNow + Google sitemap)
        if: success()
        env:
          SITE_URL: https://zingoassist.us
          INDEXNOW_KEY: 597dc5249af24dc69b88a11d6e03e22b
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install -q requests google-auth
          sleep 20
          python3 scripts/seo_ping.py
