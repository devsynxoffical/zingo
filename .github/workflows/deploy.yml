name: Deploy to zingoassist.us (FTP)

# Deploys every push to main over FTPS (server: FTP_SERVER secret), TLS verified.
# The action keeps a sync-state file on the server, so only changed files are uploaded.
# A second attempt runs automatically if the host drops the first connection.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload changed files over FTPS (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          log-level: standard
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            vendor/**
            storage/**
            bootstrap/cache/**
            .env
            .env.*
            composer.phar
            *.ps1
            shell.php
            update_service_pages.php
            public/SS.zip
            public/error_log
            tests/**
            README.md
            docs/**
            public/assets/sass/**
            public/favicon.ico
            scripts/**
            .cpanel.yml
            deploy-package/**

      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 60

      - name: Upload changed files over FTPS (attempt 2)
        if: steps.attempt1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          log-level: standard
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            vendor/**
            storage/**
            bootstrap/cache/**
            .env
            .env.*
            composer.phar
            *.ps1
            shell.php
            update_service_pages.php
            public/SS.zip
            public/error_log
            tests/**
            README.md
            docs/**
            public/assets/sass/**
            public/favicon.ico
            scripts/**
            .cpanel.yml
            deploy-package/**

      - name: Notify search engines (IndexNow + Google sitemap)
        if: success()
        env:
          SITE_URL: https://zingoassist.us
          INDEXNOW_KEY: 597dc5249af24dc69b88a11d6e03e22b
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install -q requests google-auth
          sleep 20
          python3 scripts/seo_ping.py
